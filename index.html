<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10140f">
    <!-- An inline favicon avoids an unnecessary missing-file request in a new project. -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
    <title>Quest for the Holy Grail</title>
  </head>
  <body>
    <main id="game-viewport" class="game-viewport" aria-label="Quest for the Holy Grail game">
      <header class="game-header">
        <button class="brand-button" type="button" data-action="show-campaign">
          <span class="brand-mark" aria-hidden="true">♜</span>
          <span>Quest for the Holy Grail</span>
        </button>
        <div class="header-actions">
          <span id="save-status" class="save-status" aria-live="polite">Saved locally</span>
          <button class="icon-button" type="button" data-action="reset-save" title="Reset saved progress" aria-label="Reset saved progress">↻</button>
        </div>
      </header>
      <div id="screen-root" class="screen-root"></div>
    </main>

    <!-- "defer" waits for the HTML to be parsed before running the game code. -->
    <script src="js/data.js" defer></script>
    <script src="js/storage.js" defer></script>
    <script src="js/game.js" defer></script>
  </body>
</html>
