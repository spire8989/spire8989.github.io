<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10140f">
    <!-- An inline favicon avoids an unnecessary missing-file request in a new project. -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
    <title>Quest for the Holy Grail</title>
  </head>
  <body>
    <main id="game-viewport" class="game-viewport" aria-label="Quest for the Holy Grail game">
      <header class="game-header">
        <button class="brand-button" type="button" data-action="show-campaign">
          <span class="brand-mark" aria-hidden="true">♜</span>
          <span>Quest for the Holy Grail</span>
        </button>
        <div class="header-actions">
          <span id="save-status" class="save-status" aria-live="polite">Saved locally</span>
          <button class="icon-button" type="button" data-action="toggle-audio-settings" title="Audio settings" aria-label="Audio settings">♫</button>
          <button class="icon-button" type="button" data-action="reset-save" title="Reset saved progress" aria-label="Reset saved progress">↻</button>
        </div>
      </header>
      <aside id="audio-settings" class="audio-settings" hidden aria-label="Audio settings">
        <div class="audio-settings-heading"><strong>Audio</strong><button class="text-button" type="button" data-action="toggle-audio-settings">Close</button></div>
        <button class="small-button" type="button" data-action="toggle-audio-mute" aria-pressed="false">Mute</button>
        <label>SFX volume<input id="audio-sfx-volume" type="range" min="0" max="1" step="0.05" value="0.8" data-audio-setting="sfxVolume"></label>
        <label>Ambience volume<input id="audio-ambience-volume" type="range" min="0" max="1" step="0.05" value="0.6" data-audio-setting="ambienceVolume"></label>
      </aside>
      <div id="screen-root" class="screen-root"></div>
      <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>
    </main>

    <!-- "defer" waits for the HTML to be parsed before running the game code. -->
    <script src="js/data.js" defer></script>
    <script src="js/asset-data.js" defer></script>
    <script src="js/audio.js" defer></script>
    <script src="js/expedition-data.js" defer></script>
    <script src="js/dialogue-data.js" defer></script>
    <script src="js/crafting-data.js" defer></script>
    <script src="js/loot-data.js" defer></script>
    <script src="js/camp-data.js" defer></script>
    <script src="js/tuning.js" defer></script>
    <script src="js/material-rules.js" defer></script>
    <script src="js/injury-data.js" defer></script>
    <script src="js/random.js" defer></script>
    <script src="js/injury-rules.js" defer></script>
    <script src="js/healing-rules.js" defer></script>
    <script src="js/combat-data.js" defer></script>
    <script src="js/ability-rules.js" defer></script>
    <script src="js/combat-targets.js" defer></script>
    <script src="js/combat-conditions.js" defer></script>
    <script src="js/combat-effects.js" defer></script>
    <script src="js/combat-events.js" defer></script>
    <script src="js/location-data.js" defer></script>
    <script src="js/encounter-data.js" defer></script>
    <script src="js/storage.js" defer></script>
    <script src="js/economy-rules.js" defer></script>
    <script src="js/crafting-rules.js" defer></script>
    <script src="js/loot-rules.js" defer></script>
    <script src="js/campaign-rules.js" defer></script>
    <script src="js/dialogue.js" defer></script>
    <script src="js/encounters.js" defer></script>
    <script src="js/combat.js" defer></script>
    <script src="js/equipment-rules.js" defer></script>
    <script src="js/expedition-rules.js" defer></script>
    <script src="js/camp-rules.js" defer></script>
    <script src="js/simulation.js" defer></script>
    <script src="js/campaign-simulation.js" defer></script>
    <script src="js/toast.js" defer></script>
    <script src="js/game.js" defer></script>
    <script src="js/replay.js" defer></script>
    <script src="js/debug-tools.js" defer></script>
    <script src="js/simulation-ui.js" defer></script>
  </body>
</html>
